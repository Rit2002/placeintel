spring:
  application:
    name: placeintel

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_NAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      url: ${REDISDB_URL}
      ssl:
        enabled: true


ai-service:
  base-url: ${AI_SERVICE_BASE_URL}

internal:
  api-key: ${INTERNAL_API_KEY}


cloudinary:
  cloud-name: ${CLOUD_NAME}
  api-key: ${API_KEY}
  api-secret: ${API_SECRET}


server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000